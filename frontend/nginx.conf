# The web app, and the API behind it at /api: users open one address, the browser calls the same address, and the
# API's own port is not published (docker-compose.yml). The API asks for a login (app/auth.py).

# Requests per browser address (this file is included inside nginx's http block). One API process serves everyone
# and an edit costs it seconds, so one address may not keep it busy for the others. A Simulator edit fires a burst of
# about 5-10 requests, well inside the burst. If users reach nginx through one shared proxy or load balancer, they
# share one address here: raise the rates, or key the zones on the real client address that proxy passes on.
limit_req_zone $binary_remote_addr zone=spc_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=spc_login:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=spc_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    # 8080: nginx runs as a normal user (frontend/Dockerfile), which may not open ports below 1024.
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # The API takes a scenario's edits in the request; it refuses more than 16 MB itself as well.
    client_max_body_size 16m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Applied to every response below (no location sets add_header, so none drops these).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HTTPS only from the first visit on (a browser ignores this over plain http, so it is harmless before HTTPS).
    # No includeSubDomains: other apps on sibling sub-domains are not ours to decide for.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The API container by its compose service name, looked up again every 30 s, so a restarted API (new address)
    # is found without restarting nginx.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Logins: a few tries a minute per address (the API also locks an address out after 5 failures in 15 minutes).
    location = /api/v1/auth/login {
        limit_req zone=spc_login burst=5 nodelay;
        set $api_upstream http://api:8010;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /api/ {
        limit_req zone=spc_api burst=100 nodelay;
        limit_conn spc_conn 40;
        set $api_upstream http://api:8010;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A cold API builds its views for about a minute, and a first /trend can take several minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # nginx sets these for every response; drop the API's copies so each header is sent once.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Hashed build files never change; index.html must always be fresh.
    location /assets/ {
        expires max;
    }
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
